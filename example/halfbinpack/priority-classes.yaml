# Recommendations only. ERS/business owners select priorities; the plugin has no NPU preference.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: mixed-npu-high
value: 10000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Recommended NPU workload priority, managed by ERS/business owners."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: mixed-cpu-normal
value: 1000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: "Recommended CPU workload priority; CPU allocation quota always applies."
