apiVersion: v1
kind: Pod
metadata:
  name: mixed-cpu-example
  labels:
    volcano.sh/workload-type: cpu
spec:
  schedulerName: volcano
  # Example taint. Replace with the actual taint on the NPU nodes.
  tolerations:
    - key: dedicated
      operator: Equal
      value: npu
      effect: NoSchedule
  containers:
    - name: cpu
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "1"
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 256Mi
