# Merge into the scheduler ConfigMap's volcano-scheduler.conf.
# ERS owns PriorityClass assignment and the decision to enable preemption.
actions: "enqueue, allocate, backfill, preempt"
# Quota/priority hooks must be in the first victim-deciding tier.
# Do not add the stock priority plugin's Job-priority victim filter here.
tiers:
  - plugins:
      - name: halfbinpack
        enablePredicate: true
        enableNodeOrder: true
        enableTaskOrder: true
        enablePreemptable: true
        enableReclaimable: true
        arguments:
          config:
            # One cluster-wide percentage, enforced independently on each NPU node.
            cpuRatio: 30
            npuResources: "huawei.com/Ascend910,huawei.com/Ascend310"
            weight: 1
      - name: gang
      - name: conformance
  - plugins:
      - name: drf
      - name: predicates
      - name: proportion
# Avoid caching quota failures across unequal tasks sharing a Volcano task role.
configurations:
  - name: allocate
    arguments:
      predicateErrorCacheEnable: false
  - name: preempt
    arguments:
      predicateErrorCacheEnable: false
